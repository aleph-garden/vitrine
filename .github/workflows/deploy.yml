name: Deploy the documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vitrine-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # No frozen lockfile: the platform binding rolldown needs on the runner
      # is an optional dependency bun resolves at install time.
      - run: bun install
      - run: bun run check:ci
      - run: bun run --cwd packages/docs check
      - run: bun run build:docs
      - name: Deploy the documentation Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config packages/docs/wrangler.toml
