<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The 16px composition rather than the bare mark, so the leaf survives
         in a tab. Nothing else from the icon set: this document is what the
         pod hands out for every resource it holds, and its files land in the
         pod's own root namespace. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Aleph Garden</title>
    <script type="module" src="./src/entry.ts"></script>
  </head>
  <body class="theme-dark">
    <div id="chrome" class="frame">
      <div class="corner top-left"></div>
      <div class="corner top-right"></div>
      <div class="corner bottom-left"></div>
      <div class="corner bottom-right"></div>
    </div>
    <main id="root"></main>
  </body>
</html>
