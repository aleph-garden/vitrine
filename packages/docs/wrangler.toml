# The reference documentation, deployed as its own Worker. It owns one path
# prefix on aleph.garden and nothing else; the root site is a separate Worker
# deployed from the www repository. Where two route patterns match a request,
# Cloudflare picks the more specific one, so the prefix below wins over that
# Worker's catch-all.
name = "vitrine-docs"
compatibility_date = "2026-09-01"

# Without the second pattern a reader who trims the URL to the prefix leaves
# this Worker and lands on the root site.
[[routes]]
pattern = "aleph.garden/vitrine/docs/*"
zone_name = "aleph.garden"

[[routes]]
pattern = "aleph.garden/vitrine/docs"
zone_name = "aleph.garden"

# No `main`: nothing here needs a request handler. Starlight writes a
# directory index per page, and its own 404 document is served for anything
# under the prefix that does not exist.
[assets]
directory = "./dist/"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
